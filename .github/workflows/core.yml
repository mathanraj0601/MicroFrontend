name: deploy-core

on:
  push:
    branches:
      - develop
    paths:
      - Framework/core/**

# To move to a particular folder
defaults:
  run:
    working-directory: Framework/core

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: npm install
      - run: npm run build

      - name: "Blob upload"
        uses: azure/cli@v2
        with:
         azcliversion: latest
         inlineScript: |
          cd ./Framework/core
          az storage blob delete-batch  --source '$web' --connection-string ${{ secrets.AZURE_CORE_CONNECTION_STRING }}
          az storage blob upload-batch --destination '$web' --source ./build --connection-string ${{ secrets.AZURE_CORE_CONNECTION_STRING }}

