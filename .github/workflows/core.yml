name: deploy-core

on:
  push:
    branches:
      - develop
    paths: 
      - Framework/core/**
      
defaults:
  run:
    working-directory: Framework/core

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      
      - run: npm install
      - run: npm run build
      - run: echo "finished deployed"
